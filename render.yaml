services:
  - type: web
    name: ashh-ai
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python scripts/generate_sample_pdf.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
